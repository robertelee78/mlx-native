[package]
name = "mlx-native"
version = "0.14.0"
edition = "2021"
rust-version = "1.82.0"
description = "Pure-Rust Metal GPU compute library for MLX-compatible inference on Apple Silicon"
license = "MIT AND Apache-2.0"
authors = ["mlx-native contributors"]
repository = "https://github.com/robertelee78/mlx-native"
homepage = "https://github.com/robertelee78/mlx-native"
documentation = "https://docs.rs/mlx-native"
readme = "README.md"
keywords = ["metal", "gpu", "mlx", "inference", "apple-silicon"]
categories = ["os::macos-apis", "science"]
exclude = [".claude/", ".agents/", "AGENTS.md", "CLAUDE.md.pre-ruflo", "_bmad/", "_bmad-output/", "docs/", "!docs/command-buffer-autorelease-lifetime-2026-08-08.md", ".github/", "**/*.bak", "**/*.rvf", "**/*.rvf.lock"]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = true

[lib]
name = "mlx_native"
path = "src/lib.rs"

[features]
default = []
# test-utils — exposes residency-set test counters for downstream integration tests.
# Off by default; enable with `--features test-utils` for hf2q-side residency-set
# integration testing without depending on dev-dep cargo test runner.
test-utils = []

[dependencies]
metal = "0.33"
objc = "0.2"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
safetensors = "0.7"
memmap2 = "0.9.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = { version = "2", features = ["bytemuck"] }
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
static_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[package.metadata.release]
# Run semver checks before publishing to catch accidental breaking changes.
pre-release-hook = ["cargo", "semver-checks"]
# Tag format: v0.1.0, v0.2.0, etc.
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
# Push tag and commits to remote after publish.
push-remote = "origin"

