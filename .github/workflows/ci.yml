name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-metal-train:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Training shader compatibility
        run: cargo +stable test --locked --test test_flash_attn_train -- --test-threads=1

  rust-metal:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Security audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Test
        run: cargo +stable test --locked -- --test-threads=1
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable package --locked
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          crate="target/package/mlx-native-${version}.crate"
          unpacked="$RUNNER_TEMP/packed-crate"
          mkdir -p "$unpacked"
          tar -xzf "$crate" -C "$unpacked"
          cargo +stable test --locked \
            --manifest-path "$unpacked/mlx-native-${version}/Cargo.toml" \
            --test command_buffer_autorelease \
            --test test_cb_label_propagation \
            -- --test-threads=1
