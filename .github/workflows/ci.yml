name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reference naming policy
        run: bash scripts/check_reference_policy.sh
      - name: Package hygiene
        run: bash scripts/check_package_hygiene.sh

  rust-metal-train:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Training shader compatibility
        run: cargo +1.96.0 test --locked --test test_flash_attn_train -- --test-threads=1

  rust-metal:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup toolchain install 1.82.0 --profile minimal
      - name: Minimum supported Rust
        run: cargo +1.82.0 check --locked --lib
      - name: Security audit
        run: |
          cargo +1.96.0 install cargo-audit --locked --version 0.22.2
          cargo +1.96.0 audit
      - name: Test
        run: cargo +1.96.0 test --locked -- --test-threads=1
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 package --locked
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          crate="target/package/mlx-native-${version}.crate"
          unpacked="$RUNNER_TEMP/packed-crate"
          mkdir -p "$unpacked"
          tar -xzf "$crate" -C "$unpacked"
          cargo +1.96.0 test --locked \
            --manifest-path "$unpacked/mlx-native-${version}/Cargo.toml" \
            --test command_buffer_autorelease \
            --test test_cb_label_propagation \
            -- --test-threads=1
