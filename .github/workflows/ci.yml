name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reference naming policy
        run: bash scripts/check_reference_policy.sh
      - name: Package hygiene
        run: bash scripts/check_package_hygiene.sh

  rust-metal-train:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Training shader compatibility
        run: cargo +1.96.0 test --locked --test test_flash_attn_train -- --test-threads=1

  rust-metal-mm-id:
    # The compact mm_id schedule parity matrix (tests/test_mm_id_compact_schedule.rs)
    # is too heavy for a debug build on the hosted paravirtual GPU, so it runs
    # here in release. That device and SDK lack the tensor (<metal_tensor>)
    # mm_id path: the suite runs its simdgroup matrix and prints a RECORDED
    # SKIP for the tensor half. Local and self-hosted runs keep the strict default.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Compact mm_id schedule parity (simdgroup path)
        env:
          MLX_MM_ID_TEST_ALLOW_NO_TENSOR: "1"
        run: cargo +1.96.0 test --release --locked --test test_mm_id_compact_schedule -- --test-threads=1 --nocapture
  rust-metal:
    runs-on: macos-15
    # The debug-profile Gemma parity suites (GQA flash T-N8 about 2 min, warm
    # prefill about 10 min on the runner) pushed the job past 40 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup toolchain install 1.82.0 --profile minimal
      - name: Minimum supported Rust
        run: cargo +1.82.0 check --locked --lib
      - name: Security audit
        run: |
          cargo +1.96.0 install cargo-audit --locked --version 0.22.2
          cargo +1.96.0 audit
      - name: Test
        # tests/test_mm_id_compact_schedule.rs runs in rust-metal-mm-id.
        run: >-
          cargo +1.96.0 test --locked -- --test-threads=1
          --skip compact_half_tile_settings_equal_uniform_grid
          --skip n1_slotted_equals_flattened_and_n7_row_independence
          --skip n2_compact_equals_uniform_grid_on_every_entry_point
          --skip n3_invalid_metadata_
          --skip n4_schedule_reuse_is_keyed_and_bitwise
          --skip n5_half_tile_skip_against_the_32_row_body
          --skip n6_capacity_bound_and_schedule_contents
          --skip n9_scratch_constructors_serve_every_entry_point
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.96.0 package --locked
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          crate="target/package/mlx-native-${version}.crate"
          unpacked="$RUNNER_TEMP/packed-crate"
          mkdir -p "$unpacked"
          tar -xzf "$crate" -C "$unpacked"
          cargo +1.96.0 test --locked \
            --manifest-path "$unpacked/mlx-native-${version}/Cargo.toml" \
            --test command_buffer_autorelease \
            --test test_cb_label_propagation \
            -- --test-threads=1
          # Exercise the library regression from the unpacked crate too;
          # integration-test selectors above do not run library unit tests.
          crate_root="$unpacked/mlx-native-${version}"
          witness="$crate_root/src/device/mapped_backing_tests.rs"
          test -f "$witness"
          expected=$(grep -c '^#\[test\]' "$witness")
          test "$expected" -gt 0
          listing=$(cargo +1.96.0 test --locked --manifest-path "$crate_root/Cargo.toml" \
            --lib device::mapped_backing_tests -- --list)
          observed=$(printf '%s\n' "$listing" | grep -c '^device::mapped_backing_tests::.*: test$' || true)
          test "$observed" -eq "$expected"
          cargo +1.96.0 test --locked --manifest-path "$crate_root/Cargo.toml" \
            --lib device::mapped_backing_tests -- --nocapture --test-threads=1
