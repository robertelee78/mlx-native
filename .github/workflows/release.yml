name: release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main-branch commit to publish
        required: true
        type: string
      version:
        description: Exact crate version to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA"
          git fetch origin main
          main_sha=$(git rev-parse origin/main)
          test "$actual_sha" = "$main_sha"
          actual_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$actual_version" = "$EXPECTED_VERSION"
          git diff --exit-code

      - name: Toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup toolchain install 1.82.0 --profile minimal

      - name: Minimum supported Rust
        run: cargo +1.82.0 check --locked --lib

      - name: Semver compatibility
        run: |
          cargo +1.96.0 install cargo-semver-checks --locked --version 0.50.0
          cargo +1.96.0 semver-checks --baseline-version 0.14.0

      - name: Security audit
        run: |
          cargo +1.96.0 install cargo-audit --locked --version 0.22.2
          cargo +1.96.0 audit

      - name: Test exact source
        run: cargo +1.96.0 test --locked --all-features -- --test-threads=1

      - name: Package exact source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_package_hygiene.sh
          cargo +1.96.0 package --locked
          crate="target/package/mlx-native-${EXPECTED_VERSION}.crate"
          test -s "$crate"
          shasum -a 256 "$crate" | tee "$RUNNER_TEMP/release-crate.sha256"

      - name: Test packed archive
        shell: bash
        run: |
          set -euo pipefail
          crate="target/package/mlx-native-${EXPECTED_VERSION}.crate"
          unpacked="$RUNNER_TEMP/packed-crate"
          mkdir -p "$unpacked"
          tar -xzf "$crate" -C "$unpacked"
          cargo +1.96.0 test --locked --all-features \
            --manifest-path "$unpacked/mlx-native-${EXPECTED_VERSION}/Cargo.toml" \
            -- --test-threads=1

      - name: Publish exact package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CARGO_REGISTRY_TOKEN"
          published="$RUNNER_TEMP/mlx-native-${EXPECTED_VERSION}-published.crate"
          if curl --fail --location --silent --show-error \
            "https://static.crates.io/crates/mlx-native/mlx-native-${EXPECTED_VERSION}.crate" \
            --output "$published"; then
            echo "mlx-native ${EXPECTED_VERSION} is already published; verifying exact bytes"
          else
            cargo +1.96.0 publish --locked --token "$CARGO_REGISTRY_TOKEN"
          fi

      - name: Verify crates.io bytes
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk '{print $1}' "$RUNNER_TEMP/release-crate.sha256")
          downloaded="$RUNNER_TEMP/mlx-native-${EXPECTED_VERSION}.crate"
          for _ in $(seq 1 24); do
            if curl --fail --location --silent --show-error \
              "https://static.crates.io/crates/mlx-native/mlx-native-${EXPECTED_VERSION}.crate" \
              --output "$downloaded"; then
              actual=$(shasum -a 256 "$downloaded" | awk '{print $1}')
              test "$actual" = "$expected"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Test downloaded registry archive
        shell: bash
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/mlx-native-${EXPECTED_VERSION}.crate"
          unpacked="$RUNNER_TEMP/registry-crate"
          mkdir -p "$unpacked"
          tar -xzf "$downloaded" -C "$unpacked"
          cargo +1.96.0 test --locked \
            --manifest-path "$unpacked/mlx-native-${EXPECTED_VERSION}/Cargo.toml" \
            --test command_buffer_autorelease \
            --test test_cb_label_propagation \
            -- --test-threads=1

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${EXPECTED_VERSION}"
          if tag_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
            --jq '.object.sha' 2>/dev/null); then
            test "$tag_sha" = "$EXPECTED_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$EXPECTED_SHA" >/dev/null
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$EXPECTED_SHA" \
              --title "mlx-native ${EXPECTED_VERSION}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$tag" \
            "target/package/mlx-native-${EXPECTED_VERSION}.crate" \
            "$RUNNER_TEMP/release-crate.sha256" \
            --clobber

      - name: Verify GitHub release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk '{print $1}' "$RUNNER_TEMP/release-crate.sha256")
          tag="v${EXPECTED_VERSION}"
          downloaded_dir="$RUNNER_TEMP/github-release"
          mkdir -p "$downloaded_dir"
          gh release download "$tag" \
            --pattern "mlx-native-${EXPECTED_VERSION}.crate" \
            --pattern "release-crate.sha256" \
            --dir "$downloaded_dir"
          actual=$(shasum -a 256 \
            "$downloaded_dir/mlx-native-${EXPECTED_VERSION}.crate" | awk '{print $1}')
          test "$actual" = "$expected"
          checksum="$downloaded_dir/release-crate.sha256"
          test "$(grep -cve '^[[:space:]]*$' "$checksum")" -eq 1
          test "$(awk 'NF {print $1}' "$checksum")" = "$expected"
          test "$(awk 'NF {print $2}' "$checksum")" = \
            "target/package/mlx-native-${EXPECTED_VERSION}.crate"
